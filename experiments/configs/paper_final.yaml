# 논문용 기본 실험 설정
# - 공개 저장소에는 원래 scale500 base cache
#   `phase2_patha_scale500_gain_predictor/patha_agent_outputs_20260304_080157.jsonl`
#   가 남아 있지 않다.
# - 그래서 기본 엔트리포인트는 현재 공개본에 실제로 포함된 dsA cache를 가리킨다.
# - dsB / dsC는 paper_final_dsB.yaml, paper_final_dsC.yaml를 사용한다.

precollected_jsonl: "experiments/results/phase2_patha_case3_scale300/patha_agent_outputs_20260303_101209.jsonl"

seeds: [300, 301, 302, 303, 304, 305, 306, 307, 308, 309]

trust_scores:
  frequency: 0.85
  noise: 0.80
  fatformer: 0.85
  spatial: 0.85

split:
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

output:
  save_dir: experiments/results/paper_final
